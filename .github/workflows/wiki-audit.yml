name: wiki-audit

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --upgrade pip openpyxl pyyaml

      - name: Local CI gate
        shell: pwsh
        run: ./tools/ci-local.ps1 -WriteGithubSummary
